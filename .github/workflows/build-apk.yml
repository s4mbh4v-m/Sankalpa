name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web application
        run: bun run build

      - name: Ensure Android platform and Gradle project exist
        run: |
          NEED_INIT=false

          if [ ! -d "android" ]; then
            echo "Android directory not found."
            NEED_INIT=true
          elif [ ! -f "android/gradlew" ]; then
            echo "android/gradlew missing in android directory."
            NEED_INIT=true
          elif [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "android/app/build.gradle (or .kts) missing in android directory."
            NEED_INIT=true
          fi

          if [ "$NEED_INIT" = true ]; then
            echo "Native Android project missing or incomplete. Initializing via Capacitor..."
            rm -rf android
            bunx cap add android
          else
            echo "Native Android project and Gradle files verified intact."
          fi

      - name: Sync web assets with Capacitor Android
        run: bunx cap sync android

      - name: Make Gradlew executable and verify project completeness
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Error: android/gradlew not found!" >&2
            exit 1
          fi
          if [ ! -f "android/app/build.gradle" ] && [ ! -f "android/app/build.gradle.kts" ]; then
            echo "Error: android/app/build.gradle not found!" >&2
            exit 1
          fi
          chmod +x android/gradlew
          echo "Gradle wrapper and Android build files verified."

      - name: Build Android Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sankalpa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
